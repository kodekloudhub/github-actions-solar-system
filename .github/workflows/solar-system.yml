name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
    MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
    MONGO_USERNAME: superuser
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        
            env:
                MONGO_URI: 'mongodb://localhost:27017/superData'
                MONGO_USERNAME: non-prod-user
                MONGO_PASSWORD: non-prod-password      
           
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        #- name: Setup NodeJS Version
        #  uses: actions/setup-node@v4
        #  with:
        #    node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test

        - name: Cache NPM dependencies  
          uses: actions/cache@v4
          with:
              path: ~/.npm
              key: '${{ runner.os }}-node-modules-${{ hashFiles(''package-lock.json'') }}'
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
            
    Code-Coverage:
       runs-on: ubuntu-latest
       steps:
       - name: checkout the repository
         uses: actions/checkout@v4

       - name: setup NodeJS of version 18              
         uses: actions/setup-node@v4 
         with: 
           node-version: 18

       - name: Run Code-coverage
         run: npm run code-coverage
         continue-on-error: true

       - name: Upload code-coverage reports
         uses: actions/upload-artifact@v4
         with:
           name: Code-Coverage-Result
           path: coverage
           retention-days: 5   

    docker:
      runs-on: ubuntu-latest
      needs: [unit-testing, code-coverage]
      permissions:
         packages: write  
      steps:
        - name: checkout the repository
          uses: actions/checkout@v4 

        - name: docker login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{github.repository_owner}}
            password: ${{secrets.GITHUB_TOKEN}}     

        - name: docker build and push to github 
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: 'ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}' 
            
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push Docker image to dockerhub
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }} 
            
        - name: Display GitHub context   # thia used to show all github context 
          env:
            GITHUB_CONTEXT: ${{ toJson(github) }}
          run: echo "$GITHUB_CONTEXT"        

    dev-deploy:
      if: contains(github.ref, 'feature/') 
      needs: docker
      environment: 
        name: development
        url: https://${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
      outputs: 
        APP_INGRESS_URL: ${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
      runs-on: ubuntu-latest
      steps:
        - name: checkout the repository
          uses: actions/checkout@v4 

        - name: install kubectl CLI
          uses: azure/setup-kubectl@v3 
          with:
            version: 'v1.26.0'


        
        - name: Configure kubeconfig
          run: |
            mkdir -p ~/.kube
            echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
            chmod 600 ~/.kube/config    

        # - name: Get CCE cluster credentials
        #   uses: huaweicloud/cce-credential-action@v1.0.0
        #   with:
        #     ak: ${{ secrets.HUAWEI_ACCESS_KEY }}
        #     sk: ${{ secrets.HUAWEI_SECRET_KEY }}
        #     region: "eu-west-0"
        #     project_id: ${{ secrets.HUAWEI_PROJECT_ID }}
        #     cluster_id: ${{ secrets.HUAWEI_CLUSTER_ID }}    

        - name: featch kubernetes cluster details 
          run: |
            kubectl version --short    
            echo ---------------------------
            kubectl get nodes 

        - name: Replace Token in Manifest files
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: 90.84.195.76

        - name: check files 
          run: | 
             cat  kubernetes/development/*.yaml


        - name: Create MongoDB Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
              --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
              --from-literal=MONGO_USERNAME=${{vars.MONGO_USERNAME}} \
              --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
              --save-config \
              --dry-run=client \
              -o yaml | kubectl apply -f -

        - name: Deploy to Dev Env
          run: |
              kubectl apply -f kubernetes/development
      
        - name: Set App Ingress Host URL
          id: set-ingress-host-address
          run: |
            echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress | awk '$1=="solar-system" {print $3}')"  >> "$GITHUB_OUTPUT"      

    dev-integration-testing:
        if: contains(github.ref, 'feature/')
        name: Dev Integration Testing
        needs: dev-deploy
        # runs-on: ubuntu-latest
        # steps:
        # - name: Test URL Output using CURL and JQ
        #   env: 
        #     URL: ${{needs.dev-deploy.outputs.APP_INGRESS_URL}}
        #   run: |
        #     echo $URL
        #     echo "----------------------------------------"
        #     curl https://$URL/live -s -k | jq -r .status | grep -i live
        uses: ./.github/workflows/reusable-workflow.yml
        with:
          ingress_url: ${{vars.URL_HERE}}

    prod-deploy:
      if: github.ref == 'refs/heads/main'
      needs: docker
      environment: 
        name: production
        url: https://${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
      outputs: 
        APP_INGRESS_URL: ${{steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
      runs-on: ubuntu-latest
      steps:
        - name: checkout the repository
          uses: actions/checkout@v4 

        - name: install kubectl CLI
          uses: azure/setup-kubectl@v3 
          with:
            version: 'v1.26.0'

        - name: Configure kubeconfig
          run: |
            mkdir -p ~/.kube
            echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
            chmod 600 ~/.kube/config    

        # - name: Get CCE cluster credentials
        #   uses: huaweicloud/cce-credential-action@v1.0.0
        #   with:
        #     ak: ${{ secrets.HUAWEI_ACCESS_KEY }}
        #     sk: ${{ secrets.HUAWEI_SECRET_KEY }}
        #     region: "eu-west-0"
        #     project_id: ${{ secrets.HUAWEI_PROJECT_ID }}
        #     cluster_id: ${{ secrets.HUAWEI_CLUSTER_ID }}    

        - name: featch kubernetes cluster details 
          run: |
            kubectl version --short    
            echo ---------------------------
            kubectl get nodes 

        - name: Replace Token in Manifest files
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/production/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: 90.84.195.76

        - name: check files 
          run: | 
             cat  kubernetes/production/*.yaml

        - name: Create MongoDB Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
              --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
              --from-literal=MONGO_USERNAME=${{vars.MONGO_USERNAME}} \
              --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
              --save-config \
              --dry-run=client \
              -o yaml | kubectl apply -f -

        - name: Deploy to prod Env
          run: |
              kubectl apply -f kubernetes/production
      
        - name: Set App Ingress Host URL
          id: set-ingress-host-address
          run: |
            echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress | awk '$1=="solar-system" {print $3}')"  >> "$GITHUB_OUTPUT"      

    prod-integration-testing:

      
        name: prod Integration Testing
        if: github.ref == 'refs/heads/main'
        needs: prod-deploy
        runs-on: ubuntu-latest
        steps:
        - name: Test URL Output using CURL and JQ
          env: 
            URL: ${{needs.prod-deploy.outputs.APP_INGRESS_URL}}
          run: |
            echo $URL
            echo "----------------------------------------"
            curl https://$URL/live -s -k | jq -r .status | grep -i live            
            
