name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:
          image: node:20
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        #- name: Setup NodeJS Version
        #  uses: actions/setup-node@v4
        #  with:
        #    node-version: 20
        
        - name: Cache NPM dependencies
          uses: actions/cache@v6
          with:
            path: ~/.npm
            key: ${{ runner.OS }}-node-modules-${{ hashFiles('**/package-lock.json') }}
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage: 
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: run coverage
        continue-on-error: true
        run: npm run code-coverage

      - name: upload code-coverage results
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

    docker:
      runs-on: ubuntu-latest
      permissions:
        packages: write
      needs: [unit-testing, code-coverage]
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Docker build and push Image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev-deploy:
      needs: docker
      environment:
        name: development
      runs-on: ubuntu-latest 
      steps:
      - name: Install Kubernetes cluster
        uses: helm/kind-action@v1 
      - name: run the following commands
        run: |
          sleep 60
          kubectl -n kube-system get pod
          set +e
          REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
            --env MONGO_URI=${{ env.MONGO_URI}} \
            --env MONGO_USERNAME=${{ env.MONGO_USERNAME}} \
            --env MONGO_PASSWORD=${{ env.MONGO_PASSWORD}}
          set -e
          echo "kubectl returned $?"
          kubectl -n default get pod
          sleep 10
    
    integration-testing:
      needs: dev-deploy
      runs-on: ubuntu-latest
      uses: ./.github/workflows/reusable-workflow.yml
      with:
        ingress-url: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}

